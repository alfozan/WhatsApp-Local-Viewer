<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WhatsApp Local Viewer</title>
    <script>
      (() => {
        try {
          const storedTheme = window.localStorage.getItem("whatsapp_viewer_theme");
          if (storedTheme === "light" || storedTheme === "dark") {
            document.documentElement.dataset.theme = storedTheme;
          }
        } catch (_error) {}
      })();
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2300a884'/%3E%3Ctext x='32' y='41' text-anchor='middle' font-size='30' font-family='Arial' fill='white'%3EW%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ static_asset_url('css/app.css') }}">
  </head>
  <body>
    {% block content %}{% endblock %}
    <script src="{{ static_asset_url('js/app.js') }}" defer></script>
  </body>
</html>
